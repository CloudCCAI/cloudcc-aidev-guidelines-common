kind: assignment
schema_version: 5
task_id: {{TASK_ID}}
assignee: {{DEVELOPER_ID}}
assigned_by: {{MANAGER_ID}}
status: active
assigned_at: {{TIMESTAMP}}
expires_at: {{EXPIRES_AT}}
spec_path: {{SPEC_PATH}}
task_status_path: {{TASK_STATUS_PATH}}
branch: {{BRANCH}}
change_request_url: n/a
pr_url: n/a
scope_mode: {{SCOPE_MODE}}
allowed_write_roots:
  - {{ALLOWED_WRITE_ROOT}}
scope_files:
  - {{TASK_STATUS_PATH}}
protected_paths:
  - .claw/assignments
  - .claw/developers
  - .github/workflows
touch_policy: exclusive
shared_contracts:
  - {{SPEC_PATH}}
task_boundary:
  - "工作必须服务于 {{TASK_ID}} 及其关联的验收标准。"
change_manifest_required: true
signature: "{{SIGNATURE_OR_EXTERNAL_REFERENCE}}"
preflight_required: true
local_login_required: true
identity_policy: "ssh_challenge_response + git_platform_account + ssh_commit_signing"
notes: "只有项目经理可以创建、扩大、暂停、撤销或延长此授权；禁止在此保存秘密。"
